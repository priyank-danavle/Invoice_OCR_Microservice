# =============================================================================
# OCR Microservice — Nginx Reverse Proxy Config
# =============================================================================
# File: /etc/nginx/sites-available/ocr-microservice
# Enable: ln -sf /etc/nginx/sites-available/ocr-microservice /etc/nginx/sites-enabled/
# SSL:  certbot --nginx -d ocr.yourcompany.com
# =============================================================================

# HTTP → HTTPS redirect (Certbot fills in the HTTPS block automatically)
server {
    listen 80;
    listen [::]:80;
    server_name ocr.yourcompany.com;   # ← replace with your actual domain

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Certbot will add ssl_certificate directives below
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ocr.yourcompany.com;   # ← replace with your actual domain

    # ── SSL (managed by Certbot) ──────────────────────────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/ocr.yourcompany.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ocr.yourcompany.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Upload size (must be >= MAX_FILE_SIZE_MB in .env) ────────────────────
    client_max_body_size 15M;

    # ── Proxy to OCR microservice ─────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade       $http_upgrade;
        proxy_set_header   Connection    "upgrade";
        proxy_set_header   Host          $host;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeout for OCR (Mistral can be slow on large PDFs)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ── Health check — no auth, no logging ───────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:9001/health;
        access_log off;
        proxy_read_timeout 5s;
    }

    # ── Block direct access to .env and hidden files ──────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/ocr-microservice-access.log;
    error_log  /var/log/nginx/ocr-microservice-error.log warn;
}
